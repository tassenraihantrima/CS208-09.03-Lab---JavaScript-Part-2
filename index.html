<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <section class="login-card">
    <h2 class="login-title">Login</h2>
    <form id="login-form">
      <label class="label" for="username">Username</label>
      <input class="input" id="username" type="text" placeholder="Enter username" autocomplete="username" required>

      <label class="label" for="password">Password</label>
      <input class="input" id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>

      <p class="hint">Password must be ≥ 8 chars, contain an uppercase letter, and not include “password”.</p>

      <button class="btn" type="submit">Login</button>
    </form>
  </section>

  <script src="script.js" defer></script>
</body>
</html>
