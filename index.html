<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CS208 – Login + Password Check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/dist/style.css" />
</head>
<body>
  <h1>HTML Rocks!!</h1>
  <section class="login-card">
    <h2>Login to Account</h2>
    <form id="login-form">
      <div class="form-row">
        <input
          class="input"
          id="username"
          type="text"
          placeholder="Username / Email"
          autocomplete="username"
          required
        />
      </div>
      <div class="form-row">
        <input
          class="input"
          id="password"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
      </div>
      <button class="btn" type="submit">Login</button>
      <p class="hint">This won’t submit anywhere—just checks password strength.</p>
    </form>
  </section>

  <ul>
    <li><a href="/hello">Click here to say hello</a></li>
    <li><button id="hello-link">Click Me!</button></li>
    <li><button id="joke-button">Dad Joke!</button></li>
  </ul>

  <h2 id="joke-display"></h2>

  <script src="/dist/script.js"></script>
</body>
</html>
